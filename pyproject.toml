[project]
name = "docs-converter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.9.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["reader", "writer"]
exclude = ["tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "S",
    "A",
    "C4",
    "SIM",
    "PTH",
]

[tool.ruff.lint.isort]
known-first-party = ["reader", "writer"]

[tool.ruff.format]
skip-magic-trailing-comma = false
